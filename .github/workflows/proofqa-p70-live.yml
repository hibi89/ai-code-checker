name: PROOFQA P70 real Graphify and agent-browser synthetic acceptance

on:
  push:
    branches:
      - feature/proofqa-ax-p70-graph-browser
    paths:
      - "proofqa_p70.py"
      - "proofqa_p50.py"
      - "scripts/proofqa_p70_*"
      - "tests/test_proofqa_p70.py"
      - "tests/test_proofqa_p50.py"
      - ".github/workflows/proofqa-p70-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proofqa-p70-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-synthetic-p70:
    name: Exact source Graphify AST + Chromium browser synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      GRAPHIFY_BACKEND: none
      GRAPHIFY_QUERY_LOG_DISABLE: "1"
      PYTHONUTF8: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-offline.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install exact Graphify code-only and SQL parser
        run: python -m pip install --disable-pip-version-check "graphifyy[sql]==0.9.108"
      - name: Install exact agent-browser CLI
        run: npm install --global agent-browser@0.43.0
      - name: Install browser runtime
        run: agent-browser install
      - name: Verify exact tool versions
        run: |
          python -c "import importlib.metadata; assert importlib.metadata.version('graphifyy') == '0.9.108'"
          agent-browser --version
      - name: P70 pure source-provenance and P50 regression
        run: python -m unittest tests.test_proofqa_p70 tests.test_proofqa_p50 -v
      - name: Real Graphify local AST code and SQL, two findings correlation
        run: python -m scripts.proofqa_p70_graph_acceptance
      - name: Real agent-browser Chromium local UI HTTP and state acceptance
        run: python -m scripts.proofqa_p70_browser_acceptance
