name: JS TS parser feasibility (not shipped)

on:
  push:
    paths:
      - 'scripts/probe_js_ts_parser.py'
      - 'scripts/prototype_js_ts_adapter.py'
      - 'scripts/evaluate_js_ts_prototype.py'
      - 'tests/test_js_ts_adapter_contract.py'
      - 'tests/test_js_ts_parser_probe.py'
      - 'requirements-parser-probe.txt'
      - '.github/workflows/js-ts-parser-feasibility.yml'
      - 'P1E_JS_TS_PARSER_FEASIBILITY_20261026.md'
  pull_request:
    paths:
      - 'scripts/probe_js_ts_parser.py'
      - 'scripts/prototype_js_ts_adapter.py'
      - 'scripts/evaluate_js_ts_prototype.py'
      - 'tests/test_js_ts_adapter_contract.py'
      - 'tests/test_js_ts_parser_probe.py'
      - 'requirements-parser-probe.txt'
      - '.github/workflows/js-ts-parser-feasibility.yml'
      - 'P1E_JS_TS_PARSER_FEASIBILITY_20261026.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-grammar-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install fixed binary wheels only on CI runner (not in product)
        run: |
          python -m pip install --only-binary=:all: -r requirements-parser-probe.txt
      - name: CI-only JS, TS, TSX syntax parser smoke and license metadata
        run: python -m scripts.probe_js_ts_parser
      - name: Evaluate independent JS/TS/TSX syntax-only candidate fixtures
        run: python -m scripts.evaluate_js_ts_prototype
      - name: Synthetic parser-probe boundary tests
        run: python -m unittest discover -s tests -p test_js_ts_parser_probe.py -v

# Does not modify the product EXE, dependencies or actual JS/TS coverage.
