name: Windows portable candidate smoke

on:
  pull_request:
    paths:
      - 'desktop_core.py'
      - 'desktop_ui.py'
      - 'scripts/windows_gui_e2e.py'
      - 'scripts/windows_browser_pdf_smoke.py'
      - 'scripts/audit_frozen_exe.py'
      - 'scripts/stage_runtime_original_licenses.py'
      - 'scripts/verify_staged_tcl_tk_license.py'
      - 'tests/test_verify_staged_tcl_tk_license.py'
      - 'scripts/runtime_version_receipt.py'
      - 'tests/test_runtime_version_receipt.py'
      - 'tests/test_stage_runtime_original_licenses.py'
      - 'offline_models.py'
      - 'review_models.py'
      - 'scripts/check_offline_frozen_deps.py'
      - 'tests/test_offline_dependency_boundary.py'
      - 'scripts/offline_dependency_inventory.py'
      - 'scripts/map_frozen_licenses.py'
      - 'scripts/reconcile_notice_gaps.py'
      - 'scripts/build_notice_review_queue.py'
      - 'scripts/render_notice_review_worksheet.py'
      - 'tests/test_render_notice_review_worksheet.py'
      - 'tests/test_notice_review_queue.py'
      - 'tests/test_notice_gap_ledger.py'
      - 'scripts/reconcile_native_build.py'
      - 'scripts/reconcile_exe_toc.py'
      - 'scripts/reconcile_pkg_toc.py'
      - 'scripts/classify_unmatched_carchive.py'
      - 'tests/test_classify_unmatched_carchive.py'
      - 'tests/test_pkg_toc_provenance.py'
      - 'tests/test_exe_toc_provenance.py'
      - 'tests/test_native_build_provenance.py'
      - 'tests/test_component_license_mapping.py'
      - 'scripts/offline_dependency_inventory.py'
      - 'tests/test_frozen_exe_audit.py'
      - 'offline_core.py'
      - 'input_safety.py'
      - 'output_safety.py'
      - 'tests/test_input_safety.py'
      - 'offline_report.py'
      - 'code_input.py'
      - 'static_checks.py'
      - 'review_models.py'
      - 'requirements-offline-build.txt'
      - 'scripts/build_windows_portable.ps1'
      - 'scripts/mvp_acceptance.py'
      - 'verify_local.ps1'
      - 'tests/test_mvp_acceptance.py'
      - 'scripts/windows_acceptance_readonly.ps1'
      - 'scripts/windows_owner_oneclick_qa.ps1'
      - 'tests/test_windows_owner_oneclick_qa.py'
      - 'scripts/windows_local_exe_smoke.ps1'
      - 'scripts/windows_local_exe_smoke_contract.py'
      - 'tests/test_windows_local_exe_smoke_contract.py'
      - 'scripts/windows_acceptance_contract.py'
      - 'scripts/consolidate_windows_retail_evidence.py'
      - 'tests/test_consolidate_windows_retail_evidence.py'
      - 'scripts/windows_defender_file_scan.ps1'
      - 'scripts/windows_defender_scan_contract.py'
      - 'tests/test_windows_defender_scan_contract.py'
      - 'tests/test_windows_acceptance_contract.py'
      - '.github/workflows/windows-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe-smoke:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned packaging dependencies
        run: python -m pip install -r requirements-offline-build.txt
      - name: Verify local single-command Windows smoke
        shell: powershell
        run: .\verify_local.ps1 -Quick
      - name: Exercise real Tk widgets on Windows runner (synthetic)
        run: python -m scripts.windows_gui_e2e
      - name: Browser print self-contained Korean HTML to PDF (synthetic)
        run: python -m scripts.windows_browser_pdf_smoke
      - name: Verify MVP scan/report user journey before candidate packaging
        run: python -m scripts.mvp_acceptance
      - name: Build EXE with opt-in local owner preflight (not retail approval)
        shell: pwsh
        run: ./scripts/build_windows_portable.ps1 -OwnerAcceptance -EvidenceDir '.build-windows/owner-oneclick-qa'
      - name: Re-run existing EXE on Windows without Python as synthetic customer-candidate workflow
        shell: pwsh
        run: |
          ./scripts/windows_local_exe_smoke.ps1 -ExePath 'dist-windows/CodeCheckerOffline.exe' -OutputPath '.build-windows/windows-local-exe-smoke.json' -TimeoutSeconds 120
      - name: Confirm exact binary receipt and preserve all consumer release gates
        run: |
          python -m scripts.windows_local_exe_smoke_contract --evidence .build-windows/windows-local-exe-smoke.json --exe dist-windows/CodeCheckerOffline.exe
      - name: Capture read-only local binary/Defender/signature observations
        shell: pwsh
        run: |
          ./scripts/windows_acceptance_readonly.ps1 -ExePath 'dist-windows/CodeCheckerOffline.exe' -OutputPath '.build-windows/windows-acceptance-readonly.json'
      - name: Verify receipt hash and keep all human release gates unverified
        run: python -m scripts.windows_acceptance_contract --evidence .build-windows/windows-acceptance-readonly.json --exe dist-windows/CodeCheckerOffline.exe
      - name: Observe actual local Defender custom scan command without automatic remediation
        shell: pwsh
        run: |
          ./scripts/windows_defender_file_scan.ps1 -ExePath 'dist-windows/CodeCheckerOffline.exe' -OutputPath '.build-windows/defender-custom-scan.json' -TimeoutSeconds 120
      - name: Validate Defender receipt and keep malware-free/customer release UNVERIFIED
        run: python -m scripts.windows_defender_scan_contract --evidence .build-windows/defender-custom-scan.json --exe dist-windows/CodeCheckerOffline.exe
      - name: Audit actual frozen EXE CArchive, nested PYZ and local license file evidence
        run: python -m scripts.audit_frozen_exe --exe dist-windows/CodeCheckerOffline.exe --out .build-windows/frozen-exe-evidence.json
      - name: Observe actual frozen Tcl Tk patchlevels for license reviewer (not approval)
        shell: pwsh
        run: |
          # A --windowed GUI EXE may return control to PowerShell before it
          # finishes; use the same bounded child-process wait as the existing
          # synthetic Windows EXE smoke rather than an immediate LASTEXITCODE.
          $exe = (Resolve-Path -LiteralPath 'dist-windows/CodeCheckerOffline.exe').Path
          $folder = (Resolve-Path -LiteralPath '.build-windows').Path
          $receipt = Join-Path $folder 'runtime-version-receipt.json'
          if (Test-Path -LiteralPath $receipt) { throw 'Refuse existing runtime receipt' }
          $info = [System.Diagnostics.ProcessStartInfo]::new()
          $info.FileName = $exe
          $info.ArgumentList.Add('--runtime-version-receipt')
          $info.ArgumentList.Add($receipt)
          $info.WorkingDirectory = (Get-Location).Path
          $info.UseShellExecute = $false
          $info.CreateNoWindow = $true
          $process = [System.Diagnostics.Process]::new()
          try {
            $process.StartInfo = $info
            if (-not $process.Start()) { throw 'Cannot start frozen runtime probe' }
            if (-not $process.WaitForExit(60000)) {
              try { $process.Kill() } catch { }
              try { [void]$process.WaitForExit(5000) } catch { }
              throw 'Frozen runtime probe exceeded 60-second timeout'
            }
            if ($process.ExitCode -ne 0) { throw "Frozen runtime probe exited $($process.ExitCode)" }
          } finally {
            $process.Dispose()
          }
          if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) { throw 'Frozen runtime receipt missing' }
          python -m scripts.runtime_version_receipt --verify $receipt $exe
          if ($LASTEXITCODE -ne 0) { throw 'Frozen runtime receipt mismatch' }
      - name: Stage EXE-bound CPython Tcl Tk PyInstaller original license candidates locally
        run: |
          python -m scripts.stage_runtime_original_licenses --exe dist-windows/CodeCheckerOffline.exe --audit .build-windows/frozen-exe-evidence.json --runtime-receipt .build-windows/runtime-version-receipt.json --out-dir .build-windows/runtime-original-license-candidates
      - name: Verify original source hashes and retain human NOTICE release blocks
        run: |
          python -c "import hashlib,json; from pathlib import Path; root=Path('.build-windows/runtime-original-license-candidates'); x=json.loads((root/'manifest.json').read_text(encoding='utf-8')); a=json.loads(Path('.build-windows/frozen-exe-evidence.json').read_text(encoding='utf-8')); assert x['exe_sha256']==a['exe_sha256']; assert x['original_candidate_file_count']==len(x['originals'])>0; assert sum(x['source_role_counts'].values())==len(x['originals']); assert set(x['source_role_counts'])=={'cpython','tcl','tk','pyinstaller'}; assert x['actual_exe_sha256_confirmed'] is True; assert all(hashlib.sha256((root/r['candidate_file']).read_bytes()).hexdigest()==r['sha256'] for r in x['originals']); assert x['third_party_license_notice_human_review_required'] is True and x['customer_notice_ready'] is False and x['customer_release_ready'] is False and x['copyright_and_redistribution_rights_verified'] is False; print('LOCAL_EXACT_RUNTIME_ORIGINAL_TEXT_HASHES_RECORDED_NO_LEGAL_SIGNOFF')"
      - name: Audit exact EXE Tcl Tk installed source against upstream or retain explicit missing-original gate
        run: |
          python -m scripts.verify_staged_tcl_tk_license --exe dist-windows/CodeCheckerOffline.exe --runtime-receipt .build-windows/runtime-version-receipt.json --staged-dir .build-windows/runtime-original-license-candidates --out .build-windows/tcltk-upstream-installed-source-match.json
          python -c "import hashlib,json; from pathlib import Path; p=Path('.build-windows/tcltk-upstream-installed-source-match.json'); x=json.loads(p.read_text(encoding='utf-8')); exe=Path('dist-windows/CodeCheckerOffline.exe'); assert x['exe_sha256']==hashlib.sha256(exe.read_bytes()).hexdigest(); assert x['customer_release_ready'] is False and x['third_party_notice_ready'] is False and x['license_compliance_certified'] is False; status=x['status']; good=status=='SOURCE_LICENSE_BYTES_ONLY_HUMAN_REVIEW_REQUIRED'; missing=status=='MISSING_INSTALLED_SOURCE_REVIEW_REQUIRED'; assert good or missing; assert (x.get('staged_installed_source_hashes_verified') is True and len(x['source_originals'])==2 and all(i['upstream_original_bytes_match'] is True and i['exact_bundled_binary_owner_verified'] is False for i in x['source_originals'])) if good else (x['source_equality_verified'] is False and len(x['missing_or_ambiguous_roles'])>0); print('EXACT_EXE_TCL_TK_SOURCE_MATCHED_ONLY' if good else 'EXACT_EXE_TCL_TK_INSTALLED_ORIGINAL_MISSING_RELEASE_BLOCKED')"
      - name: Enforce offline executable excludes Gemini/Pydantic runtime
        run: python -m scripts.check_offline_frozen_deps --audit .build-windows/frozen-exe-evidence.json
      - name: Confirm manifest is kept local and flags manual NOTICE review
        run: |
          python -c "import json; from pathlib import Path; p=Path('.build-windows/frozen-exe-evidence.json'); j=json.loads(p.read_text(encoding='utf-8')); assert j['archive']['top_level_count']>0; assert j['archive']['pyz_module_count']>0; assert j['license_compliance_certified'] is False; assert j['third_party_notice_ready_to_distribute'] is False; assert j['customer_release_ready'] is False; print('LOCAL_BINARY_MANIFEST_PRESENT_REVIEW_GATE_OPEN')"
      - name: Map actual embedded entry name candidates and stage original installed LICENSE texts locally
        run: python -m scripts.map_frozen_licenses --audit .build-windows/frozen-exe-evidence.json --mapping-out .build-windows/ownership-candidates.json --notice-draft-out .build-windows/NOTICE_REVIEW_DRAFT.md
      - name: Enforce unresolved license and customer-release gates
        run: |
          python -c "import json; from pathlib import Path; p=Path('.build-windows/ownership-candidates.json'); m=json.loads(p.read_text(encoding='utf-8')); a=json.loads(Path('.build-windows/frozen-exe-evidence.json').read_text(encoding='utf-8')); assert m['all_items_accounted_for_in_metadata']; assert m['total_rows']==a['archive']['top_level_count']+a['archive']['pyz_module_count']; assert m['candidate_dist_count']==len(m['installed_dist_candidates'])==0; assert m['license_text_draft']['staged_original_license_files']>0; assert m['license_compliance_certified'] is False; assert m['customer_release_ready'] is False; assert m['third_party_notice_ready_to_distribute'] is False; print('LOCAL_OWNER_CANDIDATES_PRESENT_DISTRIBUTION_BLOCKED')"
      - name: Reconcile remaining native and resource names to local build source records
        run: python -m scripts.reconcile_native_build --mapping .build-windows/ownership-candidates.json --analysis-toc .build-windows/CodeCheckerOffline/Analysis-00.toc --exe dist-windows/CodeCheckerOffline.exe --out .build-windows/native-provenance.json
      - name: Enforce original unresolved accounting and non-commercial gates
        run: |
          python -c "import json; from pathlib import Path; a=json.loads(Path('.build-windows/ownership-candidates.json').read_text(encoding='utf-8')); p=json.loads(Path('.build-windows/native-provenance.json').read_text(encoding='utf-8')); assert p['previous_unresolved_archive_entries']==a['unresolved_count']; assert p['all_entries_counted']; assert p['build_toc_paths_not_exposed']; assert p['source_path_not_a_license_or_vendor_proof']; assert p['customer_release_ready'] is False; assert p['legal_notice_approved'] is False; print('NATIVE_BUILD_PROVENANCE_EVIDENCE_LOCAL_ONLY')"
      - name: Account for P0-F unmatched entries using bounded EXE build TOC metadata
        run: python -m scripts.reconcile_exe_toc --prior .build-windows/native-provenance.json --audit .build-windows/frozen-exe-evidence.json --exe-toc .build-windows/CodeCheckerOffline/EXE-00.toc --out .build-windows/exe-toc-evidence.json
      - name: Keep P0-G archive evidence and customer-release flags fail-closed
        run: |
          python -c "import json; from pathlib import Path; p=json.loads(Path('.build-windows/exe-toc-evidence.json').read_text(encoding='utf-8')); n=json.loads(Path('.build-windows/native-provenance.json').read_text(encoding='utf-8')); assert p['all_pending_entries_accounted_for']; assert p['previously_not_unique_analysis_claims']==n['not_uniquely_recorded_in_build_toc']; assert p['exe_toc_entry_claims']+p['ambiguous_exe_toc_claims']+p['without_exe_toc_claims']==p['previously_not_unique_analysis_claims']; assert p['absolute_build_paths_excluded'] and p['exe_toc_record_not_vendor_or_license_proof']; assert p['customer_release_ready'] is False and p['legal_notice_approved'] is False and p['license_compliance_certified'] is False; print('EXE_TOC_METADATA_REVIEW_ONLY_CUSTOMER_RELEASE_BLOCKED')"
      - name: Inspect last P0-G unmatched archive entry against actual PKG build TOC
        run: python -m scripts.reconcile_pkg_toc --prior .build-windows/exe-toc-evidence.json --audit .build-windows/frozen-exe-evidence.json --pkg-toc .build-windows/CodeCheckerOffline/PKG-00.toc --out .build-windows/pkg-toc-evidence.json
      - name: Enforce P0-H complete accounting and legal release blocks
        run: |
          python -c "import json; from pathlib import Path; g=json.loads(Path('.build-windows/exe-toc-evidence.json').read_text(encoding='utf-8')); p=json.loads(Path('.build-windows/pkg-toc-evidence.json').read_text(encoding='utf-8')); assert p['all_prior_unmatched_accounted_for']; assert p['previously_unmatched_exe_toc']==g['without_exe_toc_claims']; assert p['pkg_unique_record_claims']+p['pkg_ambiguous_record_claims']+p['pkg_no_record_claims']==p['previously_unmatched_exe_toc']; assert p['build_source_paths_excluded'] and p['metadata_not_owner_or_license_proof']; assert p['customer_release_ready'] is False and p['legal_notice_approved'] is False and p['license_compliance_certified'] is False; print('PKG_TOC_METADATA_CHECKED_NO_RELEASE')"
      - name: Classify final unclaimed CArchive row using exact local EXE option type
        run: |
          python -m scripts.classify_unmatched_carchive --audit .build-windows/frozen-exe-evidence.json --pkg .build-windows/pkg-toc-evidence.json --exe dist-windows/CodeCheckerOffline.exe --out .build-windows/final-unmatched-carchive.json
      - name: Preserve original copyright and every remaining customer release block
        run: |
          python -c "import json; from pathlib import Path; p=json.loads(Path('.build-windows/final-unmatched-carchive.json').read_text(encoding='utf-8')); assert p['actual_exe_hash_verified'] is True; assert p['previously_no_pkg_toc_claims']==len(p['records'])==p['runtime_option_metadata_count']+p['unresolved_payload_count']; assert p['metadata_not_evidence_of_license_permission'] is True; assert p['customer_notice_ready'] is False and p['customer_release_ready'] is False and p['license_compliance_certified'] is False; assert all(r['third_party_copyright_notice_review_still_required'] is True and r['actual_archive_source_or_vendor_verified'] is False for r in p['records']); print('PYINSTALLER_OPTION_METADATA_REVIEW_ONLY_NO_LICENSE_SIGNOFF')"
      - name: Assert verified PYZ.pyz container is separate from unresolved embedded module owners
        run: |
          python -c "import json; from pathlib import Path; a=json.loads(Path('.build-windows/frozen-exe-evidence.json').read_text(encoding='utf-8')); m=json.loads(Path('.build-windows/ownership-candidates.json').read_text(encoding='utf-8')); p=json.loads(Path('.build-windows/final-unmatched-carchive.json').read_text(encoding='utf-8')); k=[r for r in a['archive']['top_level'] if r['name']=='PYZ.pyz' and r['typecode']=='z']; d=[r for r in m['entries'] if r['kind']=='CArchive' and r['name']=='PYZ.pyz']; assert len(k)==len(d)==1; assert d[0]['mapping']=='pyinstaller_pyz_container_format_candidate'; assert any(r['archive']=='PYZ.pyz' for r in a['archive']['pyz_modules']); assert p['runtime_option_metadata_count']==0 and p['unresolved_payload_count']==0 and p['previously_no_pkg_toc_claims']==0; assert m['customer_release_ready'] is False and m['license_compliance_certified'] is False; print('PYZ_EMBEDDED_CONTAINER_MISCLASSIFICATION_FIXED_NO_DISTRIBUTION_SIGNOFF')"
      - name: Reconcile all actual EXE component and original installed LICENSE gaps locally
        run: |
          python -m scripts.reconcile_notice_gaps --audit .build-windows/frozen-exe-evidence.json --mapping .build-windows/ownership-candidates.json --native .build-windows/native-provenance.json --exe-toc .build-windows/exe-toc-evidence.json --pkg-toc .build-windows/pkg-toc-evidence.json --out .build-windows/notice-review-gaps.json
      - name: Generate actual EXE-hash-bound per-component local review queue
        run: |
          python -m scripts.build_notice_review_queue --audit .build-windows/frozen-exe-evidence.json --mapping .build-windows/ownership-candidates.json --native .build-windows/native-provenance.json --exe-toc .build-windows/exe-toc-evidence.json --pkg-toc .build-windows/pkg-toc-evidence.json --exe dist-windows/CodeCheckerOffline.exe --out .build-windows/notice-review-queue.json
      - name: Generate printable owner and copyright review checklist for same local EXE
        run: |
          python -m scripts.render_notice_review_worksheet --audit .build-windows/frozen-exe-evidence.json --mapping .build-windows/ownership-candidates.json --native .build-windows/native-provenance.json --exe-toc .build-windows/exe-toc-evidence.json --pkg-toc .build-windows/pkg-toc-evidence.json --exe dist-windows/CodeCheckerOffline.exe --out .build-windows/manual-owner-notice-review.html
          python -c "from pathlib import Path; p=Path('.build-windows/manual-owner-notice-review.html'); x=p.read_text(encoding='utf-8'); assert p.stat().st_size>1000; assert '<html lang=' in x and 'Content-Security-Policy' in x; assert 'NOT APPROVED' in x and 'Release remains blocked' in x; assert '<script' not in x; print('EXACT_EXE_OFFLINE_PRINTABLE_OWNER_REVIEW_ONLY_NO_CUSTOMER_RELEASE')"
      - name: Keep detailed license review local and distribution blocked
        run: |
          python -c "import json; from pathlib import Path; p=Path('.build-windows/notice-review-queue.json'); x=json.loads(p.read_text(encoding='utf-8')); assert x['five_stage_evidence_reconciled'] and x['actual_exe_hash_verified']; assert x['unresolved_entry_count']==len(x['unresolved_entries_requiring_review']); assert len(x['manual_review_tasks'])==7; assert all(not v['redistribution_permission_verified'] and v['human_owner_version_and_license_review']=='REQUIRED' for v in x['unresolved_entries_requiring_review']); assert x['original_license_texts_included'] is False and x['third_party_notice_ready'] is False and x['license_compliance_certified'] is False and x['customer_release_ready'] is False; print('LOCAL_NOTICE_REVIEW_EACH_UNRESOLVED_ITEM_REQUIRES_HUMAN_VERIFICATION')"
      - name: Preserve every manual license review and release blocker
        run: |
          python -c "import json; from pathlib import Path; x=json.loads(Path('.build-windows/notice-review-gaps.json').read_text(encoding='utf-8')); assert x['metadata_complete'] is True; assert x['candidate_distribution_count']==0; assert x['selected_installed_distribution_count']==len(x['distribution_review'])>=1; assert x['selected_installed_distribution_count']>=x['candidate_distribution_count']; assert len(x['manual_review_tasks'])==7; assert x['original_license_texts_embedded_in_output'] is False; assert x['notice_ready_to_distribute'] is False; assert x['copyright_and_binary_owners_verified'] is False; assert x['license_compliance_certified'] is False; assert x['customer_release_ready'] is False; print('LOCAL_NOTICE_GAP_LEDGER_ACCOUNTED_REVIEW_REQUIRED')"
      - name: Bind OS, GUI, runtime and Defender evidence to same EXE without retail approval
        run: |
          python -m scripts.consolidate_windows_retail_evidence --exe dist-windows/CodeCheckerOffline.exe --readonly .build-windows/windows-acceptance-readonly.json --smoke .build-windows/windows-local-exe-smoke.json --runtime .build-windows/runtime-version-receipt.json --defender .build-windows/defender-custom-scan.json --out .build-windows/exact-exe-retail-preflight-summary.json
          python -c "import json; from pathlib import Path; p=Path('.build-windows/exact-exe-retail-preflight-summary.json'); x=json.loads(p.read_text(encoding='utf-8')); assert x['status']=='EXACT_BINARY_RECEIPTS_VALID_RELEASE_BLOCKED'; assert all(v=='UNVERIFIED' for v in x['human_release_gates'].values()); assert x['customer_release_ready'] is False and x['legal_notice_approved'] is False and x['malware_free_certified'] is False and x['real_buyer_pc_test_certified'] is False; print('LOCAL_WINDOWS_EVIDENCE_CONSOLIDATED_NO_RETAIL_APPROVAL')"
      - name: Owner one-command Windows EXE QA and manual acceptance worksheet (not release)
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '.build-windows/owner-oneclick-qa/owner-preflight.json' -PathType Leaf)) { throw 'Integrated owner Windows QA receipt missing' }
          python -c "import hashlib,json; from pathlib import Path; root=Path('.build-windows/owner-oneclick-qa'); x=json.loads((root/'owner-preflight.json').read_text(encoding='utf-8')); exe=Path('dist-windows/CodeCheckerOffline.exe'); assert x['format']=='code_checker_owner_windows_oneclick_preflight_v1'; assert x['exe_sha256']==hashlib.sha256(exe.read_bytes()).hexdigest(); assert len(x['manual_gates'])==10 and all(v=='UNVERIFIED' for v in x['manual_gates'].values()); assert x['customer_release_ready'] is False and x['customer_os_acceptance_certified'] is False and x['rights_and_notice_certified'] is False; assert x['os_network_packet_capture']=='NOT_PERFORMED'; assert (root/'owner-manual-checklist.md').is_file(); assert (root/'exe-synthetic-gui.json').is_file(); assert (root/'readonly-os-observation.json').is_file(); print('OWNER_ONECLICK_REAL_EXE_SYNTHETIC_PASS_MANUAL_RELEASE_BLOCKED')"
      - name: Confirm EXE exists and print digest
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist-windows/CodeCheckerOffline.exe')) { throw 'EXE not produced' }
          Get-FileHash -LiteralPath 'dist-windows/CodeCheckerOffline.exe' -Algorithm SHA256

# No artifact upload: public repo, unsigned candidate; scripted GUI / headless PDF are not clean-device/user/visual/packet QA.
