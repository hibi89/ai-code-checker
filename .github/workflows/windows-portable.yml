name: Windows portable candidate smoke

on:
  pull_request:
    paths:
      - 'desktop_core.py'
      - 'desktop_ui.py'
      - 'scripts/windows_gui_e2e.py'
      - 'scripts/windows_browser_pdf_smoke.py'
      - 'scripts/audit_frozen_exe.py'
      - 'scripts/offline_dependency_inventory.py'
      - 'tests/test_frozen_exe_audit.py'
      - 'offline_core.py'
      - 'offline_report.py'
      - 'code_input.py'
      - 'static_checks.py'
      - 'review_models.py'
      - 'requirements-offline-build.txt'
      - 'scripts/build_windows_portable.ps1'
      - '.github/workflows/windows-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe-smoke:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned packaging dependencies
        run: python -m pip install -r requirements-offline-build.txt
      - name: Exercise real Tk widgets on Windows runner (synthetic)
        run: python -m scripts.windows_gui_e2e
      - name: Browser print self-contained Korean HTML to PDF (synthetic)
        run: python -m scripts.windows_browser_pdf_smoke
      - name: Build EXE and run synthetic offline smoke
        shell: pwsh
        run: ./scripts/build_windows_portable.ps1
      - name: Audit actual frozen EXE CArchive, nested PYZ and local license file evidence
        run: python -m scripts.audit_frozen_exe --exe dist-windows/CodeCheckerOffline.exe --out .build-windows/frozen-exe-evidence.json
      - name: Confirm manifest is kept local and flags manual NOTICE review
        run: |
          python -c "import json; from pathlib import Path; p=Path('.build-windows/frozen-exe-evidence.json'); j=json.loads(p.read_text(encoding='utf-8')); assert j['archive']['top_level_count']>0; assert j['archive']['pyz_module_count']>0; assert j['license_compliance_certified'] is False; assert j['third_party_notice_ready_to_distribute'] is False; assert j['customer_release_ready'] is False; print('LOCAL_BINARY_MANIFEST_PRESENT_REVIEW_GATE_OPEN')"
      - name: Confirm EXE exists and print digest
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist-windows/CodeCheckerOffline.exe')) { throw 'EXE not produced' }
          Get-FileHash -LiteralPath 'dist-windows/CodeCheckerOffline.exe' -Algorithm SHA256

# No artifact upload: public repo, unsigned candidate; scripted GUI / headless PDF are not clean-device/user/visual/packet QA.
