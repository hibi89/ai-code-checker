name: Windows portable candidate smoke

on:
  pull_request:
    paths:
      - 'desktop_core.py'
      - 'desktop_ui.py'
      - 'scripts/windows_gui_e2e.py'
      - 'scripts/windows_browser_pdf_smoke.py'
      - 'scripts/audit_frozen_exe.py'
      - 'scripts/map_frozen_licenses.py'
      - 'scripts/reconcile_native_build.py'
      - 'scripts/reconcile_exe_toc.py'
      - 'scripts/reconcile_pkg_toc.py'
      - 'tests/test_pkg_toc_provenance.py'
      - 'tests/test_exe_toc_provenance.py'
      - 'tests/test_native_build_provenance.py'
      - 'tests/test_component_license_mapping.py'
      - 'scripts/offline_dependency_inventory.py'
      - 'tests/test_frozen_exe_audit.py'
      - 'offline_core.py'
      - 'input_safety.py'
      - 'output_safety.py'
      - 'tests/test_input_safety.py'
      - 'offline_report.py'
      - 'code_input.py'
      - 'static_checks.py'
      - 'review_models.py'
      - 'requirements-offline-build.txt'
      - 'scripts/build_windows_portable.ps1'
      - 'scripts/windows_acceptance_readonly.ps1'
      - 'scripts/windows_acceptance_contract.py'
      - 'scripts/windows_defender_file_scan.ps1'
      - 'scripts/windows_defender_scan_contract.py'
      - 'tests/test_windows_defender_scan_contract.py'
      - 'tests/test_windows_acceptance_contract.py'
      - '.github/workflows/windows-portable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe-smoke:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned packaging dependencies
        run: python -m pip install -r requirements-offline-build.txt
      - name: Exercise real Tk widgets on Windows runner (synthetic)
        run: python -m scripts.windows_gui_e2e
      - name: Browser print self-contained Korean HTML to PDF (synthetic)
        run: python -m scripts.windows_browser_pdf_smoke
      - name: Build EXE and run synthetic offline smoke
        shell: pwsh
        run: ./scripts/build_windows_portable.ps1
      - name: Capture read-only local binary/Defender/signature observations
        shell: pwsh
        run: |
          ./scripts/windows_acceptance_readonly.ps1 -ExePath 'dist-windows/CodeCheckerOffline.exe' -OutputPath '.build-windows/windows-acceptance-readonly.json'
      - name: Verify receipt hash and keep all human release gates unverified
        run: python -m scripts.windows_acceptance_contract --evidence .build-windows/windows-acceptance-readonly.json --exe dist-windows/CodeCheckerOffline.exe
      - name: Observe actual local Defender custom scan command without automatic remediation
        shell: pwsh
        run: |
          ./scripts/windows_defender_file_scan.ps1 -ExePath 'dist-windows/CodeCheckerOffline.exe' -OutputPath '.build-windows/defender-custom-scan.json' -TimeoutSeconds 120
      - name: Validate Defender receipt and keep malware-free/customer release UNVERIFIED
        run: python -m scripts.windows_defender_scan_contract --evidence .build-windows/defender-custom-scan.json --exe dist-windows/CodeCheckerOffline.exe
      - name: Audit actual frozen EXE CArchive, nested PYZ and local license file evidence
        run: python -m scripts.audit_frozen_exe --exe dist-windows/CodeCheckerOffline.exe --out .build-windows/frozen-exe-evidence.json
      - name: Confirm manifest is kept local and flags manual NOTICE review
        run: |
          python -c "import json; from pathlib import Path; p=Path('.build-windows/frozen-exe-evidence.json'); j=json.loads(p.read_text(encoding='utf-8')); assert j['archive']['top_level_count']>0; assert j['archive']['pyz_module_count']>0; assert j['license_compliance_certified'] is False; assert j['third_party_notice_ready_to_distribute'] is False; assert j['customer_release_ready'] is False; print('LOCAL_BINARY_MANIFEST_PRESENT_REVIEW_GATE_OPEN')"
      - name: Map actual embedded entry name candidates and stage original installed LICENSE texts locally
        run: python -m scripts.map_frozen_licenses --audit .build-windows/frozen-exe-evidence.json --mapping-out .build-windows/ownership-candidates.json --notice-draft-out .build-windows/NOTICE_REVIEW_DRAFT.md
      - name: Enforce unresolved license and customer-release gates
        run: |
          python -c "import json; from pathlib import Path; p=Path('.build-windows/ownership-candidates.json'); m=json.loads(p.read_text(encoding='utf-8')); a=json.loads(Path('.build-windows/frozen-exe-evidence.json').read_text(encoding='utf-8')); assert m['all_items_accounted_for_in_metadata']; assert m['total_rows']==a['archive']['top_level_count']+a['archive']['pyz_module_count']; assert m['candidate_dist_count']>0; assert m['license_text_draft']['staged_original_license_files']>0; assert m['license_compliance_certified'] is False; assert m['customer_release_ready'] is False; assert m['third_party_notice_ready_to_distribute'] is False; print('LOCAL_OWNER_CANDIDATES_PRESENT_DISTRIBUTION_BLOCKED')"
      - name: Reconcile remaining native and resource names to local build source records
        run: python -m scripts.reconcile_native_build --mapping .build-windows/ownership-candidates.json --analysis-toc .build-windows/CodeCheckerOffline/Analysis-00.toc --exe dist-windows/CodeCheckerOffline.exe --out .build-windows/native-provenance.json
      - name: Enforce original unresolved accounting and non-commercial gates
        run: |
          python -c "import json; from pathlib import Path; a=json.loads(Path('.build-windows/ownership-candidates.json').read_text(encoding='utf-8')); p=json.loads(Path('.build-windows/native-provenance.json').read_text(encoding='utf-8')); assert p['previous_unresolved_archive_entries']==a['unresolved_count']; assert p['all_entries_counted']; assert p['build_toc_paths_not_exposed']; assert p['source_path_not_a_license_or_vendor_proof']; assert p['customer_release_ready'] is False; assert p['legal_notice_approved'] is False; print('NATIVE_BUILD_PROVENANCE_EVIDENCE_LOCAL_ONLY')"
      - name: Account for P0-F unmatched entries using bounded EXE build TOC metadata
        run: python -m scripts.reconcile_exe_toc --prior .build-windows/native-provenance.json --audit .build-windows/frozen-exe-evidence.json --exe-toc .build-windows/CodeCheckerOffline/EXE-00.toc --out .build-windows/exe-toc-evidence.json
      - name: Keep P0-G archive evidence and customer-release flags fail-closed
        run: |
          python -c "import json; from pathlib import Path; p=json.loads(Path('.build-windows/exe-toc-evidence.json').read_text(encoding='utf-8')); n=json.loads(Path('.build-windows/native-provenance.json').read_text(encoding='utf-8')); assert p['all_pending_entries_accounted_for']; assert p['previously_not_unique_analysis_claims']==n['not_uniquely_recorded_in_build_toc']; assert p['exe_toc_entry_claims']+p['ambiguous_exe_toc_claims']+p['without_exe_toc_claims']==p['previously_not_unique_analysis_claims']; assert p['absolute_build_paths_excluded'] and p['exe_toc_record_not_vendor_or_license_proof']; assert p['customer_release_ready'] is False and p['legal_notice_approved'] is False and p['license_compliance_certified'] is False; print('EXE_TOC_METADATA_REVIEW_ONLY_CUSTOMER_RELEASE_BLOCKED')"
      - name: Inspect last P0-G unmatched archive entry against actual PKG build TOC
        run: python -m scripts.reconcile_pkg_toc --prior .build-windows/exe-toc-evidence.json --audit .build-windows/frozen-exe-evidence.json --pkg-toc .build-windows/CodeCheckerOffline/PKG-00.toc --out .build-windows/pkg-toc-evidence.json
      - name: Enforce P0-H complete accounting and legal release blocks
        run: |
          python -c "import json; from pathlib import Path; g=json.loads(Path('.build-windows/exe-toc-evidence.json').read_text(encoding='utf-8')); p=json.loads(Path('.build-windows/pkg-toc-evidence.json').read_text(encoding='utf-8')); assert p['all_prior_unmatched_accounted_for']; assert p['previously_unmatched_exe_toc']==g['without_exe_toc_claims']; assert p['pkg_unique_record_claims']+p['pkg_ambiguous_record_claims']+p['pkg_no_record_claims']==p['previously_unmatched_exe_toc']; assert p['build_source_paths_excluded'] and p['metadata_not_owner_or_license_proof']; assert p['customer_release_ready'] is False and p['legal_notice_approved'] is False and p['license_compliance_certified'] is False; print('PKG_TOC_METADATA_CHECKED_NO_RELEASE')"
      - name: Confirm EXE exists and print digest
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'dist-windows/CodeCheckerOffline.exe')) { throw 'EXE not produced' }
          Get-FileHash -LiteralPath 'dist-windows/CodeCheckerOffline.exe' -Algorithm SHA256

# No artifact upload: public repo, unsigned candidate; scripted GUI / headless PDF are not clean-device/user/visual/packet QA.
