name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, windows-2025]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile application modules
        run: python -m py_compile main.py code_input.py reporting.py reviewer.py review_models.py static_checks.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify local-only dry run
        run: python main.py tests/test_review_flow.py --dry-run

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependency auditor
        run: python -m pip install pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
